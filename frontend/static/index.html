<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbucE manuscript viewer</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="topbar">
        <h1>AlbucE viewer</h1>
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="tab-transcription">Transcription</button>
            <button class="tab-btn" data-tab="tab-alignment">3-way alignment</button>
        </nav>
        <div class="page-selector">
            <label for="page-select">Page</label>
            <select id="page-select"></select>
        </div>
        <div class="topbar-actions" id="tab-actions"></div>
    </header>

    <main>
        <!-- ============ TAB 1: transcription viewer ============ -->
        <section id="tab-transcription" class="tab-panel active">
            <div class="pane pane-image" data-target="1">
                <div class="zoom-toolbar">
                    <button data-zoom-action="out" title="Zoom out (Cmd/Ctrl + scroll down)">−</button>
                    <span class="zoom-level">100%</span>
                    <button data-zoom-action="in" title="Zoom in (Cmd/Ctrl + scroll up)">+</button>
                    <button data-zoom-action="reset" title="Fit to pane">⌂</button>
                </div>
                <div class="image-scroll">
                    <div class="image-wrap" id="image-wrap-1"></div>
                </div>
            </div>
            <div class="pane pane-text">
                <div class="pane-header">
                    <span class="pane-title">Model transcription</span>
                    <div class="pane-actions">
                        <button id="copy-btn">Copy</button>
                        <button id="download-btn">Download .txt</button>
                    </div>
                </div>
                <div class="line-list" id="lines-ours-1"></div>
            </div>
        </section>

        <!-- ============ TAB 2: 3-way alignment ============ -->
        <section id="tab-alignment" class="tab-panel">
            <div class="pane pane-image" data-target="2">
                <div class="zoom-toolbar">
                    <button data-zoom-action="out" title="Zoom out (Cmd/Ctrl + scroll down)">−</button>
                    <span class="zoom-level">100%</span>
                    <button data-zoom-action="in" title="Zoom in (Cmd/Ctrl + scroll up)">+</button>
                    <button data-zoom-action="reset" title="Fit to pane">⌂</button>
                </div>
                <div class="image-scroll">
                    <div class="image-wrap" id="image-wrap-2"></div>
                </div>
            </div>
            <div class="pane pane-text">
                <div class="pane-header">
                    <span class="pane-title">Scholarly transcription</span>
                </div>
                <div class="line-list" id="lines-scholarly"></div>
            </div>
            <div class="pane pane-text">
                <div class="pane-header">
                    <span class="pane-title">Model transcription</span>
                    <div class="diff-legend">
                        <span class="diff-chip diff-substitution">substitution</span>
                        <span class="diff-chip diff-addition">addition</span>
                        <span class="diff-chip diff-deletion">deletion</span>
                        <span class="diff-chip diff-abbreviation">abbrev</span>
                        <span class="diff-chip diff-punctuation">punct</span>
                        <label class="editorial-toggle" title="Editorial differences (punctuation, brevigraph expansion, de+lo spacing) are hidden by default — they are not OCR errors.">
                            <input type="checkbox" id="toggle-editorial"> show editorial
                        </label>
                    </div>
                </div>
                <div class="line-list" id="lines-ours-2"></div>
            </div>
        </section>
    </main>

    <footer class="statusbar" id="status">Loading…</footer>

    <script src="/app.js"></script>
</body>
</html>
